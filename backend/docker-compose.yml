services:
  ollama:
    image: ollama/ollama:latest
    container_name: orbit-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: always

  orbit-backend:
    build: .
    container_name: orbit-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_API=http://ollama:11434
    depends_on:
      - ollama
    restart: always

volumes:
  ollama:
